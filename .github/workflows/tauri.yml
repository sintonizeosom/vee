name: Build Windows Tauri .EXE Installer

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Generate Desktop Icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          
          # Criar imagens de tamanhos padronizados
          $sizes = @(32, 128)
          foreach ($s in $sizes) {
              $bmp = New-Object System.Drawing.Bitmap $s, $s
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(79, 70, 229))
              $g.FillEllipse($brush, 0, 0, $s, $s)
              $brush.Dispose()
              $g.Dispose()
              
              if ($s -eq 32) {
                  $bmp.Save("src-tauri/icons/32x32.png", [System.Drawing.Imaging.ImageFormat]::Png)
              } elseif ($s -eq 128) {
                  $bmp.Save("src-tauri/icons/128x128.png", [System.Drawing.Imaging.ImageFormat]::Png)
                  $bmp.Save("src-tauri/icons/128x128@2x.png", [System.Drawing.Imaging.ImageFormat]::Png)
                  
                  # Gerar o icon.ico no formato binário Windows exato que o RC.EXE exige
                  $hIcon = $bmp.GetHicon()
                  $icon = [System.Drawing.Icon]::FromHandle($hIcon)
                  $fs = New-Object System.IO.FileStream("src-tauri/icons/icon.ico", [System.IO.FileMode]::Create)
                  $icon.Save($fs)
                  $fs.Close()
                  $icon.Dispose()
              }
              $bmp.Dispose()
          }

      - name: Build Web App
        run: bun run build

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: 'VEE Desktop v1.0.0'
          releaseBody: 'Instalador nativo Windows do VEE Video Editor Espectro (~10MB)'
          releaseDraft: false
          prerelease: false
