name: Build Windows Tauri .EXE Installer

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Generate Desktop Icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tauri-apps/tauri/v1.5.0/examples/api/src-tauri/icons/icon.ico" -OutFile "src-tauri/icons/icon.ico"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tauri-apps/tauri/v1.5.0/examples/api/src-tauri/icons/32x32.png" -OutFile "src-tauri/icons/32x32.png"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tauri-apps/tauri/v1.5.0/examples/api/src-tauri/icons/128x128.png" -OutFile "src-tauri/icons/128x128.png"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tauri-apps/tauri/v1.5.0/examples/api/src-tauri/icons/128x128@2x.png" -OutFile "src-tauri/icons/128x128@2x.png"

      - name: Build Web App
        run: bun run build

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: 'VEE Desktop v1.0.0'
          releaseBody: 'Instalador nativo Windows do VEE Video Editor Espectro (~10MB)'
          releaseDraft: false
          prerelease: false
