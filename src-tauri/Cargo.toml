[package]
name = "vee-desktop"
version = "7.2.0"
description = "VEE - Video Editor Espectro Windows Desktop"
authors = ["Rubemar Albuquerque (RCA-APPS)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
